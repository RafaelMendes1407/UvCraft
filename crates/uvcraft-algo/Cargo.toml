[package]
name = "uvcraft-algo"
description = "UvCraft algorithms: analysis, projections, unfold, seams, packing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }
glam.workspace = true
rayon.workspace = true
serde.workspace = true
thiserror.workspace = true
uvcraft-core.workspace = true
wgpu = "30"
pollster = "0.4"
bytemuck = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
faer = { version = "0.24", default-features = false, features = ["rayon"] }

[lints]
workspace = true
